name: Pharos Natural Payment Agent — verified parser, live contract, unsigned draft
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Test parser, follow-ups, on-chain mocked checks and unsigned safety
        run: npm test
      - name: Bundle Cloudflare Worker
        run: npm run build
  live-pharos-unsigned-check:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Verify deployed Worker, real Circle USDC and read-only draft flow
        run: node scripts/smoke-deployed.mjs
      - name: Archive actual live RPC evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pharos-natural-language-payment-live-proof
          path: proof/live-payment-evidence.json
          retention-days: 30
          if-no-files-found: error
